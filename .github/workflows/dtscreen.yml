name: dtscreen
on: workflow_dispatch
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: representability screen (b44efe82) - INVENTED ids only, never a real tenant object
        uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN;
            const base = process.env.ACTIONS_RUNTIME_URL;
            core.info('BASE ' + base);
            async function probe(label, url) {
              try {
                const r = await fetch(url, {headers:{Authorization:'Bearer '+t, Accept:'application/json;api-version=6.0-preview'}});
                const b = await r.text();
                core.info('PROBE ' + label + ' | http=' + r.status + ' len=' + b.length + ' | ' + b.slice(0,160).replace(/\s+/g,' '));
              } catch (e) { core.info('PROBE ' + label + ' | THREW ' + e.message); }
            }
            // A: does the route family exist at all (positive control)
            await probe('A list-agentclouds', base + '_apis/distributedtask/agentclouds');
            // B: INVENTED numeric agentCloudId - belongs to nobody
            await probe('B invented id 424242', base + '_apis/distributedtask/agentclouds/424242/requests');
            // C: CONTROL - same shape, same length, also nonexistent. Varies ONLY existence.
            await probe('C control id 424243', base + '_apis/distributedtask/agentclouds/424243/requests');
            // D: malformed - to separate schema refusal from lookup refusal
            await probe('D malformed id', base + '_apis/distributedtask/agentclouds/not-an-id/requests');
            // E: negative control - invented route on same host
            await probe('E invented route', base + '_apis/distributedtask/zzqnotaroute');
