name: dtscreen
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: read effective cache capability from the runtime JWT claim
        uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN;
            const p = JSON.parse(Buffer.from(t.split('.')[1],'base64').toString());
            core.info('ARM event=' + process.env.GITHUB_EVENT_NAME +
                      ' ref=' + process.env.GITHUB_REF +
                      ' head_repo_fork=' + (process.env.GITHUB_HEAD_REF||'-'));
            core.info('ARM ac=' + JSON.stringify(p.ac));
            core.info('ARM acsl=' + JSON.stringify(p.acsl));
            core.info('ARM claimkeys=' + JSON.stringify(Object.keys(p).sort()));
            core.info('ARM scp=' + JSON.stringify(p.scp));
            core.info('ARM orchid=' + JSON.stringify(p.orchid));
            core.info('ARM runnerctx=' + JSON.stringify({
              run_id: process.env.GITHUB_RUN_ID,
              base: process.env.GITHUB_BASE_REF || '-',
              sha: process.env.GITHUB_SHA,
              repo: process.env.GITHUB_REPOSITORY,
              actor: process.env.GITHUB_ACTOR,
              tokperm: 'see-below'
            }));
