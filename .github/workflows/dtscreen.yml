name: dtscreen
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
  issue_comment:
  issues:
  watch:
    types: [started]
  fork:
  create:
  label:
  milestone:
  release:
  gollum:
  discussion:
  discussion_comment:
  project_card:
  status:
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN;
            const p = JSON.parse(Buffer.from(t.split('.')[1],'base64').toString());
            const ac = p.ac ? JSON.parse(p.ac) : null;
            const w = (ac||[]).filter(s => (s.Permission & 2) !== 0).map(s => s.Scope);
            core.info('ARM event=' + process.env.GITHUB_EVENT_NAME +
                      ' actor=' + process.env.GITHUB_ACTOR + ' ref=' + process.env.GITHUB_REF);
            core.info('ARM ac=' + JSON.stringify(p.ac));
            core.info('ARM WRITABLE_SCOPES=' + JSON.stringify(w));
