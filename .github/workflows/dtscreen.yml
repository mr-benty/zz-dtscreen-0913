name: dtscreen
on: workflow_dispatch
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: capture FULL error text - the discriminating evidence
        uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN, base = process.env.ACTIONS_RUNTIME_URL;
            async function full(label, path) {
              const r = await fetch(base + path, {headers:{Authorization:'Bearer '+t, Accept:'application/json;api-version=6.0-preview'}});
              const b = await r.text();
              core.info('FULL ' + label + ' http=' + r.status);
              core.info('BODY ' + b.replace(/\s+/g,' '));
            }
            await full('invented-A 424242', '_apis/distributedtask/agentclouds/424242');
            await full('invented-B 999888777', '_apis/distributedtask/agentclouds/999888777');
