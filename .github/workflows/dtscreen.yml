name: dtscreen
on: workflow_dispatch
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: distributedtask tier MAP via the route-existence oracle
        uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN, base = process.env.ACTIONS_RUNTIME_URL;
            const RES = ['pools','agentclouds','queues','deploymentgroups','environments','variablegroups',
                         'taskgroups','serviceendpoints','agents','jobrequests','hublicense','packages',
                         'taskhubmessages','elasticpools','machinegroups','resourcelocks','tasks','yamlschema',
                         'agentcloudtypes','agentcloudrequests','deployments','securityroles'];
            const out = [];
            for (const r of RES) {
              try {
                const resp = await fetch(base + '_apis/distributedtask/' + r,
                  {headers:{Authorization:'Bearer '+t, Accept:'application/json;api-version=6.0-preview'}});
                const b = await resp.text();
                let shape;
                if (b.length === 0) shape = (resp.status===404 ? 'UNROUTED' : 'empty-' + resp.status);
                else if (b.includes('typeKey')) shape = 'TYPED-' + resp.status;
                else shape = 'BODY-' + resp.status;
                out.push([r, resp.status, shape, b.slice(0,90).replace(/\s+/g,' ')]);
              } catch(e) { out.push([r,'ERR','THREW',e.message]); }
            }
            for (const [r,st,shape,b] of out) core.info('MAP ' + r.padEnd(22) + String(st).padEnd(5) + shape.padEnd(14) + b);
