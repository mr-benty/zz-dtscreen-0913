name: dtscreen
on: workflow_dispatch
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: discriminator hunt - sub-resource shapes under an INVENTED agentCloudId
        uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN, base = process.env.ACTIONS_RUNTIME_URL;
            // HIGH invented ids only. A LOW id is the one most likely to be a REAL foreign object.
            const A = '424242', B = '424243';
            async function p(label, path) {
              try {
                const r = await fetch(base + path, {headers:{Authorization:'Bearer '+t, Accept:'application/json;api-version=6.0-preview'}});
                const b = await r.text();
                core.info('P ' + label.padEnd(34) + ' http=' + String(r.status).padEnd(4) + ' len=' + String(b.length).padEnd(5) + ' ' + b.slice(0,120).replace(/\s+/g,' '));
              } catch(e){ core.info('P ' + label + ' THREW ' + e.message); }
            }
            for (const id of [A,B]) {
              await p('obj '+id,               '_apis/distributedtask/agentclouds/'+id);
              await p('requests '+id,          '_apis/distributedtask/agentclouds/'+id+'/requests');
              await p('agentcloudrequests '+id,'_apis/distributedtask/agentcloudrequests/'+id);
            }
            await p('pools (adjacent family)', '_apis/distributedtask/pools');
            await p('obj MALFORMED',           '_apis/distributedtask/agentclouds/not-an-id');
