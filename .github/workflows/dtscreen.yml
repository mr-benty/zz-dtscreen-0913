name: dtscreen
on: workflow_dispatch
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: does authz fire AFTER validation? (dispatch-before-guard test)
        uses: actions/github-script@v7
        with:
          script: |
            const t = process.env.ACTIONS_RUNTIME_TOKEN, base = process.env.ACTIONS_RUNTIME_URL;
            async function call(label, path, method, body) {
              const opts = {method, headers:{Authorization:'Bearer '+t, Accept:'application/json;api-version=6.0-preview'}};
              if (body) { opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
              const r = await fetch(base + path, opts);
              const b = await r.text();
              core.info('== ' + label + ' http=' + r.status);
              core.info('   BODY ' + b.replace(/\s+/g,' ').slice(0,520));
            }
            // OWNER-SIDE BASELINE BEFORE the mutating arm (attributability)
            await call('BASELINE agentclouds BEFORE', '_apis/distributedtask/agentclouds', 'GET');
            // Well-formed body: satisfies the stated validation. If authz runs AFTER validation we now see 403.
            await call('POST well-formed agentcloud', '_apis/distributedtask/agentclouds', 'POST',
                       {name:'zz-dtscreen-0913-disposable', type:'zz-probe',
                        sharedSecret:'zzDTSCREEN0913disposableProbeSecret', acquireAgentEndpoint:false,
                        acquisitionTimeout:900, maxParallelism:1});
            // POST-STATE as its own round trip
            await call('POST-STATE agentclouds AFTER', '_apis/distributedtask/agentclouds', 'GET');
