name: dtscreen
on: workflow_dispatch
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: run-step context
        run: |
          echo "RUNSTEP ACTIONS_RUNTIME_TOKEN len=${#ACTIONS_RUNTIME_TOKEN}"
      - name: ACTION context (github-script is a JS action)
        uses: actions/github-script@v7
        with:
          script: |
            const names = Object.keys(process.env).filter(k => k.startsWith('ACTIONS_')).sort();
            core.info('ACTION-CONTEXT ACTIONS_* names: ' + JSON.stringify(names));
            const t = process.env.ACTIONS_RUNTIME_TOKEN || '';
            core.info('ACTION-CONTEXT runtime token length: ' + t.length);
            core.info('ACTION-CONTEXT ACTIONS_RESULTS_URL: ' + (process.env.ACTIONS_RESULTS_URL || 'unset'));
            core.info('ACTION-CONTEXT ACTIONS_RUNTIME_URL: ' + (process.env.ACTIONS_RUNTIME_URL || 'unset'));
            if (t.length) {
              const parts = t.split('.').length;
              core.info('token shape: parts=' + parts + ' (3 => JWT)');
            }
